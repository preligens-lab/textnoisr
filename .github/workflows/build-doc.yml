name: build-doc
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build the documentation in strict mode
        run: uv run --locked mkdocs build --strict
      - name: Publish the documentation
        if: github.event_name == 'push'
        run: uv run --locked mkdocs gh-deploy --force
