name: code-style
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
  push:
    branches: [main]
jobs:
  check-hooks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.2
    - name: Run pre-commit hooks
      run: uv run --locked pre-commit run --all-files
