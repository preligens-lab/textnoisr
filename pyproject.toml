[project]
name = "textnoisr"
version = "1.2.0"
description = "Add noise to text at the character level"
authors = [{ name = "Lilian Sanselme", email = "lilian.sanselme@preligens.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
maintainers = [
    { name = "Félix Martel", email = "felix.martel@preligens.com" },
    { name = "Romain Keramitas", email = "romain.keramitas@preligens.com" },
    { name = "Valentin Masdeu", email = "valentin.masdeu@preligens.com" },
]
keywords = [
    "nlp",
    "natural language processing",
    "text",
    "augmentation",
    "ocr",
    "typo",
]
classifiers = [
    "Topic :: Text Processing :: General",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "datasets>=2.14.5",
    "numpy>=1.26.1",
    "scipy>=1.11.3",
]

[project.urls]
Homepage = "https://preligens-lab.github.io/textnoisr"
Repository = "https://github.com/preligens-lab/textnoisr"
Documentation = "https://preligens-lab.github.io/textnoisr"
"Bug Tracker" = "https://github.com/preligens-lab/textnoisr/issues"

[dependency-groups]
dev = [
    "pytest-cov>=4.1.0,<8",
    "pydocstyle>=6.3.0,<7",
    "mkdocs>=1.5.3,<2",
    "mkdocs-material>=9.4.6,<10",
    "mkdocstrings>=0.26.1,<1.1",
    "mkdocstrings-python>=1.11.1,<3",
    "pymdown-extensions>=10.3,<13.0",
    "black>=23.10,<27.0",
    "flake8>=6.1.0,<8",
    "flake8-print>=5.0.0,<6",
    "flake8-use-fstring>=1.4,<2",
    "isort>=5.12.0,<10",
    "mypy>=1.6.1,<3",
    "pre-commit>=3.5.0,<5",
    "pytest>=7.4.2,<10.0.0",
    "evaluate>=0.4.1,<0.5",
    "jiwer>=3.0.3,<5",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.2,<0.14.0"]
build-backend = "uv_build"

[tool.black]
string-processing = true

[tool.ruff]
# Select: Flake rules (E, F, W), isort (I), pydocstyle (D), flake8-bandit (S)
select = ["E", "F", "W", "I", "D", "S"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D106", "D107"]

[tool.ruff.per-file-ignores]
# Do not harass people writing tests with docstring rules. Ignore the S101 (assert detected) rule.
"cli.py" = ["D"]
"*tests/*" = ["D", "S101"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.bandit]
skips = ["B311"]

[[tool.mypy.overrides]]
module = "datasets"
implicit_reexport = true

[tool.pylint]
good-names="p,q,i,N,P,v,n"


[tool.pytest.ini_options]
markers = ["nightly: slow statistical tests, run by the nightly workflow"]
